# docker-compose.metasploitable.yml — Ariaska RL + Metasploitable Lab
# 
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.metasploitable.yml up
#
# This creates an isolated pentest lab network with:
#   - Ariaska RL agent container (attacker)
#   - Metasploitable 2 target (easy, Linux)
#   - Optional: Metasploitable 3 targets
#
# Prerequisites:
#   - Metasploitable 2 Docker image: tleemcjr/metasploitable2
#   - Pull first: docker pull tleemcjr/metasploitable2
#
# SECURITY WARNING:
#   This creates intentionally vulnerable containers.
#   Only use on isolated networks. Never expose to the internet.

version: '3.8'

services:
  # Ariaska RL attacker container — connected to pentest-net
  ariaska-attacker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ariaska-attacker
    volumes:
      - .:/home/ariaska/ARIASKA_RL
      - ./logs:/home/ariaska/ARIASKA_RL/logs
      - ./models:/home/ariaska/ARIASKA_RL/models
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GPT_PRIMARY_MODEL=${GPT_PRIMARY_MODEL:-gpt-5.2-codex}
      - GPT_TOKEN_LIMIT=${GPT_TOKEN_LIMIT:-8000}
      - PYTHONPATH=/home/ariaska/ARIASKA_RL
      - ARIASKA_MODE=live
      - ARIASKA_TARGET=${ARIASKA_TARGET:-172.28.0.10}
      - ARIASKA_TARGET_PROFILE=${ARIASKA_TARGET_PROFILE:-metasploitable2}
      - ARIASKA_MS3_TARGET=172.28.0.11
    command: >
      python -m ariaska_cli smart-train
      --episodes 10
      --target 172.28.0.10
      --verbosity standard
    networks:
      pentest-net:
        ipv4_address: 172.28.0.2
    depends_on:
      - metasploitable2
    cap_add:
      - NET_RAW    # For nmap raw socket scanning
      - NET_ADMIN  # For network operations

  # Metasploitable 2 — Primary target (intentionally vulnerable Linux)
  metasploitable2:
    image: tleemcjr/metasploitable2
    container_name: metasploitable2
    hostname: metasploitable
    tty: true          # Keep container alive (bash needs a TTY)
    stdin_open: true   # Allocate stdin for interactive shell
    networks:
      pentest-net:
        ipv4_address: 172.28.0.10
    # No ports exposed to host — isolated to pentest-net only
    # Metasploitable 2 exposes: 21(ftp), 22(ssh), 23(telnet), 25(smtp),
    # 80(http), 111(rpcbind), 139(netbios), 445(smb), 512-514(rexec),
    # 1099(java-rmi), 1524(backdoor), 2049(nfs), 2121(ftp), 3306(mysql),
    # 3632(distccd), 5432(postgresql), 5900(vnc), 6000(x11), 6667(irc),
    # 8009(ajp), 8180(tomcat)
    restart: unless-stopped

  # Metasploitable 3 — Secondary target (Ubuntu 14.04, harder than MS2)
  # No instant backdoors — requires proper exploitation chains.
  # Pull: docker pull kirscht/metasploitable3-ub1404
  # Build alternative: https://github.com/rapid7/metasploitable3
  # Services: 22(ssh), 80(http/wordpress), 3000(rails), 3306(mysql),
  #   8020(manageengine), 8080(tomcat/struts), 8282(axis2), 8484(jenkins),
  #   9200(elasticsearch)
  metasploitable3:
    image: kirscht/metasploitable3-ub1404
    container_name: metasploitable3
    hostname: metasploitable3
    tty: true
    stdin_open: true
    command: /bin/bash
    networks:
      pentest-net:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

networks:
  pentest-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
    # Isolate from other Docker networks
    internal: false  # Set to true for fully isolated (no internet in lab)
